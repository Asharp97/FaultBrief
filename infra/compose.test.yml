services:
  postgres:
    image: postgres@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336 # PostgreSQL 18
    environment:
      POSTGRES_DB: faultbrief_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d faultbrief_test"]
      interval: 5s
      timeout: 5s
      retries: 10
