name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: FaultBrief CI
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      FAULTBRIEF_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/faultbrief_test
    services:
      postgres:
        image: postgres@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336 # PostgreSQL 18
        env:
          POSTGRES_DB: faultbrief_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Check out the proposed change
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version-file: backend/.python-version

      - name: Install the recorded pnpm version
        run: npm install --global pnpm@11.24.0 --ignore-scripts

      - name: Install locked dependencies
        run: pnpm run setup

      - name: Install Chromium for authentication browser tests
        run: pnpm --dir frontend exec playwright install --with-deps chromium

      - name: Check formatting, lint, backend tests, build, and types
        run: pnpm run check

      - name: Check browser authentication and the reporting demo
        run: pnpm run frontend:e2e

      - name: Verify the frontend, API, and demo start
        run: pnpm run smoke
